name: 7.42 Weaver Scepter Time Lapse compatibility

on:
  push:
    branches: [fix/patch742-weaver-ally-time-lapse]
  pull_request:
    branches: [oha-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua51:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Syntax and actual-Weaver-logic tests
        run: |
          luac5.1 -p bots/BotLib/hero_weaver.lua
          luac5.1 -p tests/test_patch742_weaver_time_lapse.lua
          lua5.1 tests/test_patch742_weaver_time_lapse.lua
