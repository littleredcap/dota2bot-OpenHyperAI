name: OHA-Next Lua regression tests

on:
  pull_request:
    branches:
      - oha-next
  push:
    branches:
      - oha-next
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 -v

      - name: Validate changed Lua source syntax
        run: |
          luac5.1 -p bots/mode_team_roam_generic.lua
          luac5.1 -p bots/FunLib/jmz_func.lua
          luac5.1 -p tests/test_patch001.lua

      - name: Execute offline behavior regressions
        run: lua5.1 tests/test_patch001.lua
