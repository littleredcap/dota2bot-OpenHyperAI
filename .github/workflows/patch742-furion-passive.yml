name: 7.42 Nature's Prophet passive-ability compat

on:
  push:
    branches: [fix/patch742-furion-passive]
  pull_request:
    branches: [oha-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua51:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Syntax and actual SkillsComplement regression
        run: |
          luac5.1 -p bots/BotLib/hero_furion.lua
          luac5.1 -p tests/test_patch742_furion_passive.lua
          lua5.1 tests/test_patch742_furion_passive.lua
