name: Issue 159 endgame push opportunity

on:
  push:
    branches: [fix/issue-159-endgame-push]
  pull_request:
    branches: [oha-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua51-and-ts-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci --legacy-peer-deps --ignore-scripts --no-audit
      - name: Build TypeScript-owned Lua
        run: npm run build
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Validate Lua syntax and endgame regression
        run: |
          luac5.1 -p bots/FunLib/aba_push.lua
          luac5.1 -p tests/test_issue159_endgame_push.lua
          lua5.1 tests/test_issue159_endgame_push.lua
      - name: Ensure TypeScript source and generated Lua are in sync
        run: git diff --exit-code -- bots/FunLib/aba_push.lua
