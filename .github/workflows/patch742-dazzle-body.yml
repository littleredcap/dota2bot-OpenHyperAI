name: Patch 7.42 Dazzle Nothl projection body guard

on:
  push:
    branches: [fix/patch742-dazzle-projection-body-guard]
  pull_request:
    branches: [oha-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dazzle-body-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Validate production Lua syntax and cached body logic
        run: |
          luac5.1 -p bots/BotLib/hero_dazzle.lua
          luac5.1 -p bots/FunLib/jmz_func.lua
          luac5.1 -p tests/test_patch742_dazzle_projection_end.lua
          lua5.1 tests/test_patch742_dazzle_projection_end.lua
