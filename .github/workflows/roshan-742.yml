name: Roshan 7.42 timing regression

on:
  pull_request:
    branches:
      - oha-next
  push:
    branches:
      - fix/7.42-roshan-respawn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roshan-timer-lua51:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 -v

      - name: Validate Lua syntax
        run: |
          luac5.1 -p bots/FunLib/jmz_func.lua
          luac5.1 -p tests/test_patch742_roshan_respawn.lua

      - name: Run Roshan 7.42 regression
        run: lua5.1 tests/test_patch742_roshan_respawn.lua
