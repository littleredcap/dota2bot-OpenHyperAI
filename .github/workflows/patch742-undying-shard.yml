name: Patch 7.42 Undying defer default Shard buys

on:
  push:
    branches: [fix/patch742-undying-defer-shard]
  pull_request:
    branches: [oha-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  undying-shard-buy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check syntax and role-based production purchase contract
        run: |
          luac5.1 -p bots/BotLib/hero_undying.lua
          luac5.1 -p tests/test_patch742_undying_shard_default.lua
          lua5.1 tests/test_patch742_undying_shard_default.lua
